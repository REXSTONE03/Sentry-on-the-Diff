name: PR Sentry Reviewer

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    name: Run PR Sentry
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run PR Sentry
        uses: ./
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
